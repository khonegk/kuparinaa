<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Рецепт — редактирование</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="brand">
      <span class="brand-dot"></span>
      <h1 class="site-title">Книга рецептов</h1>
    </a>
    <nav class="site-nav">
      <a class="plain" href="dashboard.html">Назад к списку</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="form-card">
    <h1 id="formTitle">Новый рецепт</h1>
    <div id="msgBox"></div>

    <div class="field">
      <label for="category">Категория (общая для обеих версий)</label>
      <input type="text" id="category" placeholder="Например, Основные блюда">
    </div>

    <div class="field">
      <label>Какую версию сейчас заполняешь</label>
      <div class="lang-select">
        <button type="button" id="langRu" class="active" onclick="setLang('ru')">Русский</button>
        <button type="button" id="langEn" onclick="setLang('en')">English</button>
      </div>
      <div class="field-hint">Обе версии сохраняются вместе. Можно заполнить только одну — тогда рецепт будет виден только в этом языковом фильтре.</div>
    </div>

    <div id="fieldsRu">
      <div class="field">
        <label for="titleRu">Название (RU)</label>
        <input type="text" id="titleRu" placeholder="Например, Хинкал с говядиной">
      </div>
      <div class="field">
        <label for="ingredientsRu">Ингредиенты RU (каждый с новой строки)</label>
        <textarea id="ingredientsRu" placeholder="Мука — 500 г&#10;Вода — 250 мл&#10;Говядина — 600 г"></textarea>
      </div>
      <div class="field">
        <label for="instructionsRu">Шаги приготовления RU (каждый с новой строки)</label>
        <textarea id="instructionsRu" placeholder="Замесить тесто и оставить на 30 минут&#10;Отварить мясо до готовности"></textarea>
      </div>
    </div>

    <div id="fieldsEn" style="display:none">
      <div class="field">
        <label for="titleEn">Title (EN)</label>
        <input type="text" id="titleEn" placeholder="e.g. Beef Khinkal">
      </div>
      <div class="field">
        <label for="ingredientsEn">Ingredients EN (one per line)</label>
        <textarea id="ingredientsEn" placeholder="Flour — 500 g&#10;Water — 250 ml&#10;Beef — 600 g"></textarea>
      </div>
      <div class="field">
        <label for="instructionsEn">Instructions EN (one per line)</label>
        <textarea id="instructionsEn" placeholder="Knead the dough and rest for 30 minutes&#10;Boil the meat until done"></textarea>
      </div>
    </div>

    <div class="field">
      <label for="imageFile">Картинка (общая для обеих версий)</label>
      <input type="file" id="imageFile" accept="image/*">
      <div class="field-hint">Можно оставить пустым, если фото не нужно.</div>
      <img id="imagePreview" class="image-preview">
    </div>

    <div class="field">
      <label class="field-checkbox">
        <input type="checkbox" id="isPublic">
        Публичный доступ (по ссылке смогут смотреть все, редактировать — только ты)
      </label>
    </div>

    <div class="form-actions">
      <button class="btn" onclick="saveRecipe()">Сохранить</button>
      <a class="btn btn-outline" href="dashboard.html">Отмена</a>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth-guard.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const editId = params.get('id');
let existingImageUrl = null;
let me = null;

async function init() {
  me = await requireAuth();
  if (!me) return;

  if (editId) {
    document.getElementById('formTitle').textContent = 'Изменить рецепт';
    loadExisting();
  }
}

function setLang(lang) {
  document.getElementById('langRu').classList.toggle('active', lang === 'ru');
  document.getElementById('langEn').classList.toggle('active', lang === 'en');
  document.getElementById('fieldsRu').style.display = lang === 'ru' ? 'block' : 'none';
  document.getElementById('fieldsEn').style.display = lang === 'en' ? 'block' : 'none';
}

async function loadExisting() {
  const { data, error } = await supabaseClient
    .from('recipes')
    .select('*')
    .eq('id', editId)
    .single();

  if (error || !data) {
    showMsg('Не получилось загрузить рецепт для редактирования.', true);
    return;
  }

  document.getElementById('category').value = data.category || '';

  document.getElementById('titleRu').value = data.title_ru || '';
  document.getElementById('ingredientsRu').value = data.ingredients_ru || '';
  document.getElementById('instructionsRu').value = data.instructions_ru || '';

  document.getElementById('titleEn').value = data.title_en || '';
  document.getElementById('ingredientsEn').value = data.ingredients_en || '';
  document.getElementById('instructionsEn').value = data.instructions_en || '';

  document.getElementById('isPublic').checked = !!data.is_public;

  // Открыть ту версию, где реально есть текст
  setLang(data.title_ru ? 'ru' : 'en');

  if (data.image_url) {
    existingImageUrl = data.image_url;
    const preview = document.getElementById('imagePreview');
    preview.src = data.image_url;
    preview.style.display = 'block';
  }
}

document.getElementById('imageFile').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const preview = document.getElementById('imagePreview');
  preview.src = URL.createObjectURL(file);
  preview.style.display = 'block';
});

async function uploadImageIfNeeded() {
  const file = document.getElementById('imageFile').files[0];
  if (!file) return existingImageUrl;

  const ext = file.name.split('.').pop();
  const fileName = `${me.id}/${crypto.randomUUID()}.${ext}`;

  const { error: uploadError } = await supabaseClient
    .storage
    .from('recipe-images')
    .upload(fileName, file);

  if (uploadError) {
    throw new Error('Не получилось загрузить картинку: ' + uploadError.message);
  }

  const { data } = supabaseClient.storage.from('recipe-images').getPublicUrl(fileName);
  return data.publicUrl;
}

function readLangGroup(prefix) {
  const title = document.getElementById(`title${prefix}`).value.trim();
  const ingredients = document.getElementById(`ingredients${prefix}`).value.trim();
  const instructions = document.getElementById(`instructions${prefix}`).value.trim();
  const filled = [title, ingredients, instructions].filter(Boolean).length;
  return { title, ingredients, instructions, filled };
}

async function saveRecipe() {
  const category = document.getElementById('category').value.trim() || 'Разное';
  const ru = readLangGroup('Ru');
  const en = readLangGroup('En');
  const isPublic = document.getElementById('isPublic').checked;

  if (ru.filled > 0 && ru.filled < 3) {
    showMsg('Русская версия заполнена не полностью — нужны название, ингредиенты и шаги (или оставь все три поля пустыми).', true);
    return;
  }
  if (en.filled > 0 && en.filled < 3) {
    showMsg('English version is incomplete — fill title, ingredients and steps, or leave all three empty.', true);
    return;
  }
  if (ru.filled === 0 && en.filled === 0) {
    showMsg('Заполни хотя бы одну языковую версию рецепта.', true);
    return;
  }

  try {
    const imageUrl = await uploadImageIfNeeded();

    const payload = {
      category,
      title_ru: ru.filled ? ru.title : null,
      ingredients_ru: ru.filled ? ru.ingredients : null,
      instructions_ru: ru.filled ? ru.instructions : null,
      title_en: en.filled ? en.title : null,
      ingredients_en: en.filled ? en.ingredients : null,
      instructions_en: en.filled ? en.instructions : null,
      image_url: imageUrl,
      is_public: isPublic
    };

    let error;
    if (editId) {
      ({ error } = await supabaseClient.from('recipes').update(payload).eq('id', editId));
    } else {
      ({ error } = await supabaseClient.from('recipes').insert(payload));
    }

    if (error) throw new Error(error.message);

    window.location.href = 'dashboard.html';
  } catch (err) {
    showMsg(err.message, true);
  }
}

function showMsg(text, isError) {
  const box = document.getElementById('msgBox');
  box.innerHTML = `<div class="msg ${isError ? 'msg-error' : 'msg-ok'}">${text}</div>`;
}

init();
</script>
</body>
</html>
