<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Книга рецептов</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="flag-strip"></div>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="brand">
      <span class="brand-dot"></span>
      <h1 class="site-title">Книга рецептов</h1>
    </a>
    <nav class="site-nav" id="navAuth"></nav>
  </div>
</header>

<div class="profile-header-wrap">
  <section class="profile-header">
    <img class="profile-cover" id="coverImg" src="" alt="">
    <div class="profile-cover-overlay"></div>
    <h2 class="profile-name-overlay" id="profileName"></h2>
  </section>
</div>

<main class="wrap">
  <div class="profile-row">
    <img class="profile-avatar" id="avatarImg" src="" alt="">
    <div class="profile-meta">
      <p class="profile-bio" id="profileBio"></p>
      <div class="profile-social" id="profileSocial"></div>
    </div>
    <div class="recipe-count" id="recipeCount"></div>
  </div>

  <div class="filter-bar">
    <div class="filter-row" id="filterRow">
      <button class="filter-chip active" data-cat="all">Все</button>
    </div>
    <div class="filter-controls">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" id="searchInput" placeholder="Поиск рецептов...">
      </div>
      <div class="lang-toggle" id="langToggle">
        <button class="active" data-lang="all" onclick="setLangFilter('all')">Все</button>
        <button data-lang="ru" onclick="setLangFilter('ru')">RU</button>
        <button data-lang="en" onclick="setLangFilter('en')">EN</button>
      </div>
    </div>
  </div>

  <div class="card-grid" id="cardGrid">
    <div class="empty-state">Загружаю рецепты…</div>
  </div>
</main>

<footer>Публичная коллекция &middot; только просмотр</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/site-profile.js"></script>
<script src="js/nav.js"></script>
<script src="js/app.js"></script>
</body>
</html>
