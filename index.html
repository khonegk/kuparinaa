<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Книга рецептов</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="flag-strip"></div>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="brand">
      <span class="brand-dot"></span>
      <h1 class="site-title">Книга рецептов</h1>
    </a>
    <nav class="site-nav">
      <a href="admin.html">Вход для редактирования</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="filter-bar">
    <div class="filter-row" id="filterRow">
      <button class="filter-chip active" data-cat="all">Все</button>
    </div>
    <div class="lang-toggle" id="langToggle">
      <button class="active" data-lang="all" onclick="setLangFilter('all')">Все</button>
      <button data-lang="ru" onclick="setLangFilter('ru')">RU</button>
      <button data-lang="en" onclick="setLangFilter('en')">EN</button>
    </div>
  </div>

  <div class="card-grid" id="cardGrid">
    <div class="empty-state">Загружаю рецепты…</div>
  </div>
</main>

<footer>Публичная коллекция &middot; только просмотр</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/app.js"></script>
</body>
</html>
