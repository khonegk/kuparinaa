<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Рецепт</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="flag-strip"></div>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="brand">
      <span class="brand-dot"></span>
      <h1 class="site-title">Книга рецептов</h1>
    </a>
    <nav class="site-nav">
      <a class="plain" href="index.html">Ко всем рецептам</a>
      <span id="navAuth" style="display:contents"></span>
    </nav>
  </div>
</header>

<main class="wrap">
  <div id="content">
    <div class="empty-state">Загружаю рецепт…</div>
  </div>
</main>

<footer>Публичная ссылка &middot; только просмотр</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/nav.js"></script>
<script>
let recipeData = null;
let currentLang = 'ru';

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function linesToList(text, ordered) {
  const items = (text || '').split('\n').map(s => s.trim()).filter(Boolean);
  const tag = ordered ? 'ol' : 'ul';
  return `<${tag}>${items.map(i => `<li>${escapeHtml(i)}</li>`).join('')}</${tag}>`;
}

async function loadRecipe() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const requestedLang = params.get('lang');
  const content = document.getElementById('content');

  if (!id) {
    content.innerHTML = '<div class="empty-state">Рецепт не указан.</div>';
    return;
  }

  const { data, error } = await supabaseClient
    .from('recipes')
    .select('*')
    .eq('id', id)
    .eq('is_public', true)
    .single();

  if (error || !data) {
    content.innerHTML = '<div class="empty-state">Рецепт не найден или закрыт для публичного просмотра.</div>';
    return;
  }

  recipeData = data;

  if (requestedLang === 'en' && data.title_en) currentLang = 'en';
  else if (requestedLang === 'ru' && data.title_ru) currentLang = 'ru';
  else currentLang = data.title_ru ? 'ru' : 'en';

  renderRecipe();
}

function renderRecipe() {
  const data = recipeData;
  const isEn = currentLang === 'en';
  const title = isEn ? data.title_en : data.title_ru;
  const ingredients = isEn ? data.ingredients_en : data.ingredients_ru;
  const instructions = isEn ? data.instructions_en : data.instructions_ru;
  const hasBoth = data.title_ru && data.title_en;

  document.title = title + ' — Книга рецептов';

  const ingredientsLabel = isEn ? 'Ingredients' : 'Ингредиенты';
  const instructionsLabel = isEn ? 'Instructions' : 'Приготовление';
  const copyLabel = isEn ? 'Copy link' : 'Скопировать ссылку';

  const shareUrl = `${window.location.origin}${window.location.pathname}?id=${data.id}&lang=${currentLang}`;

  document.getElementById('content').innerHTML = `
    <div class="recipe-detail anim-fade-up">
      ${data.image_url ? `<img src="${data.image_url}" alt="${escapeHtml(title)}">` : ''}
      <h1>${escapeHtml(title)}</h1>
      <div class="tag-row">
        <span class="cat-tag">${escapeHtml(data.category || 'Разное')}</span>
        ${hasBoth
          ? `<div class="lang-toggle" style="display:inline-flex;">
               <button class="${!isEn ? 'active' : ''}" onclick="switchLang('ru')">RU</button>
               <button class="${isEn ? 'active' : ''}" onclick="switchLang('en')">EN</button>
             </div>`
          : `<span class="lang-badge">${currentLang.toUpperCase()}</span>`}
      </div>

      <h2>${ingredientsLabel}</h2>
      ${linesToList(ingredients, false)}

      <h2>${instructionsLabel}</h2>
      ${linesToList(instructions, true)}

      <div class="share-box">
        <input type="text" readonly value="${shareUrl}" onclick="this.select()">
        <button class="btn btn-outline" onclick="copyLink()">${copyLabel}</button>
      </div>
    </div>
  `;
}

function switchLang(lang) {
  currentLang = lang;
  const url = new URL(window.location);
  url.searchParams.set('lang', lang);
  window.history.replaceState({}, '', url);
  renderRecipe();
}

function copyLink() {
  navigator.clipboard.writeText(document.querySelector('.share-box input').value);
}

loadRecipe();
renderAuthNav('navAuth');
</script>
</body>
</html>
